[versions]
agp = "9.4.1"
# The Kotlin version the Android Gradle Plugin brings; the Compose compiler plugin must match it.
kotlin = "2.2.10"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
webkit = "1.18.0"
camera = "1.6.2"
barcodeScanning = "17.3.0"
datastore = "1.2.1"
browser = "1.9.0"
junit = "4.13.2"
coroutinesTest = "1.11.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Compose's test library brings Espresso 3.5.0, which calls InputManager.getInstance, gone in API 37.
espresso = "3.7.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcodeScanning" }
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
junit = { module = "junit:junit", version.ref = "junit" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
